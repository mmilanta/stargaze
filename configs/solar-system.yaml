# Stargaze system format v1. Distances and angles use explicit units.
# Omit time_days to search for a suitable night view; set it for an exact epoch.
# Orbit angles are measured in the shared ecliptic frame, including moon orbits.
# Sun, all eight planets, and selected moons; Earth observatory aimed at the Moon.
# Approximate fixed J2000 elements; satellite phases are illustrative, not ephemerides.
# Planet element source: https://ssd.jpl.nasa.gov/planets/approx_pos.html
# Rounded physical radii and periods retained from the original solar preset.
