name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, lint, and tooling tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python -m unittest discover -s scripts -p 'test_*.py'

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # GPU tests are opt-in and remain ignored on hosted runners.
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --target ${{ matrix.target }}
      - name: Smoke-test release packaging
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python scripts/package_release.py --profile debug --target "$TARGET" --tag "v$VERSION"

  ui:
    name: Browser interface tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  required:
    name: CI required
    if: always()
    needs: [quality, test, ui]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          UI: ${{ needs.ui.result }}
        run: test "$QUALITY" = success && test "$TEST" = success && test "$UI" = success
