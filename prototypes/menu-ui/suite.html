<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1538a4"><title>Celestial Blueprint · every screen · Stargaze</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="suite.css"><script src="suite.js" defer></script></head>
<body><div class="shell">
  <nav class="rail" id="rail" aria-label="Screen index"></nav>
  <main class="stage"><div id="screen" class="screen"></div><div id="dialog" class="backdrop" hidden></div><div id="toast" class="toast" hidden role="status"></div></main>
  <button class="rail-toggle" onclick="S.rail=!S.rail;render()" title="Screen index [`]">☰</button>
  <div class="chrome-btns"><button class="chrome-btn" onclick="S.notes=!S.notes;renderNotes()" title="Screen notes [?]">?</button></div>
  <aside class="notes" id="notes" hidden></aside>
</div></body></html>
