<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stargaze · Eyepiece</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Red+Hat+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#ff3b2f;--red-mid:#c22a22;--red-dim:#5c1611;--red-faint:#2a0a08}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--red);overflow:hidden;font:300 12px/1.5 'Red Hat Mono',monospace;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.focus{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:filter .5s ease,opacity .5s}
.focus.blur{filter:blur(9px);opacity:.55;transition:none}
.focus .over{font:400 10px 'Red Hat Mono';letter-spacing:.5em;color:var(--red-mid);text-transform:uppercase}
.focus h1{font:400 clamp(26px,3.2vw,46px)/1.1 Michroma,sans-serif;letter-spacing:.08em;margin:14px 0 10px;color:#ff5a4c;text-shadow:0 0 18px #ff3b2f66}
.focus .under{font-size:12px;color:var(--red-mid);letter-spacing:.12em}
.plate{position:fixed;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:auto auto;gap:9px 22px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.plate dt{color:var(--red-dim)}.plate dd{color:var(--red)}
.plate.right{right:5vw;text-align:right}.plate.left{left:5vw}
.engrave{position:fixed;white-space:pre;line-height:2;font:400 9px 'Red Hat Mono';letter-spacing:.3em;color:var(--red-dim);text-transform:uppercase}
.screen-obs .focus{display:none}
#corners{display:none;transition:opacity .2s}.screen-obs #corners{display:block}
#corners div{position:fixed;font:400 13px Michroma,sans-serif;letter-spacing:.12em;color:#ff5a4c;text-shadow:0 0 12px #000}
#corners small{display:block;font:400 9px 'Red Hat Mono';letter-spacing:.3em;color:var(--red-mid);margin-bottom:6px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="focus" id="focus"></div>
<dl class="plate left" id="plateL"></dl>
<dl class="plate right" id="plateR"></dl>
<div id="corners"><div style="left:5vw;top:5vh" id="cTL"></div><div style="right:5vw;top:5vh;text-align:right" id="cTR"></div><div style="left:5vw;bottom:9vh" id="cBL"></div></div>
<div class="engrave" style="left:5vw;bottom:4vh" id="engL">Stargaze optical · 25 mm Plössl</div>
<div class="engrave" style="right:5vw;bottom:4vh;text-align:right" id="engR">Night vision · red</div>
<script>
const LEVELS=[
  {t:'Ember summit',s:'Calyx and Halo — the volcano',g:'Basalt',fov:70,n:6,az:142,alt:22,lights:[[150,30,7,'#ffb07a'],[128,24,3,'#fff'],[165,41,2.5,'#fff'],[138,46,3,'#ffd9a0'],[175,18,2,'#fff'],[120,36,2,'#cfe'] ],peak:[140,14]},
  {t:'Shadow season',s:'Erg — the ringed dune sea',g:'Dunes',fov:60,n:5,az:210,alt:24,lights:[[214,32,8,'#ffe0a6'],[196,26,3,'#fff'],[228,38,2.5,'#fff'],[205,44,2,'#ffd'],[232,22,2,'#fff']],peak:null},
  {t:'The long shadow',s:'Umbra — the daily eclipse',g:'Ice field',fov:25,n:5,az:96,alt:30,lights:[[97,31,10,'#9ab'],[90,34,2,'#fff'],[103,28,2,'#fff'],[94,26,1.6,'#def'],[100,36,1.6,'#fff']],peak:null}];
const MENU=['Observe','Settings','Controls','Leave'];
const NUM=['I','II','III'];
let screen='title',sel=0,ring=0,lvl=0,minutes=0,speed=0,ev=0,view={az:142,alt:22,fov:70},fovTarget=70,slew=null,drag=null;
const $=s=>document.querySelector(s);
function defocus(){const f=$('#focus');f.classList.add('blur');requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('blur')));}
function show(s){screen=s;document.body.className='screen-'+(s==='observe'?'obs':s);
  if(s==='observe'){const L=LEVELS[lvl];view={az:L.az,alt:L.alt,fov:L.fov};fovTarget=L.fov;}
  if(s==='levels')slewTo(lvl,true);
  draw();defocus();}
function slewTo(i,instant){const L=LEVELS[i];const tgt={az:L.az,alt:L.alt+10,fov:Math.min(80,L.fov+20)};if(instant)view={...tgt};slew=tgt;}
function draw(){
  const L=LEVELS[lvl];
  if(screen==='title')$('#focus').innerHTML=`<div class="over">Focus</div><h1>${MENU[sel].toUpperCase()}</h1><div class="under">${['three skies are waiting','image · light · instrument','what every dial does','close the dome'][sel]}</div>`;
  if(screen==='levels')$('#focus').innerHTML=`<div class="over">Field study ${NUM[lvl]}</div><h1>${L.t.toUpperCase()}</h1><div class="under">${L.s}</div>`;
  $('#plateL').innerHTML=screen==='levels'?`<dt>Ground</dt><dd>${L.g}</dd><dt>Lights</dt><dd>${L.n}</dd><dt>Field</dt><dd>${L.fov}°</dd>`:'';
  $('#plateR').innerHTML=screen==='levels'?`<dt>Best</dt><dd>${lvl?'—':'72.4'}</dd><dt>Attempts</dt><dd>${lvl?'0':'3'}</dd><dt></dt><dd style="color:#ff5a4c">Enter ▸ look</dd>`:'';
  $('#engR').textContent=screen==='observe'?'drag · look\nwheel · zoom\n←→ · time\n, . · exposure\nesc · leave':'Night vision · red';
}
addEventListener('keydown',e=>{
  if(screen==='title'){
    if(e.key==='ArrowDown'){sel=(sel+1)%MENU.length;defocus();}
    if(e.key==='ArrowUp'){sel=(sel+MENU.length-1)%MENU.length;defocus();}
    if((e.key==='Enter'||e.key==='ArrowRight')&&sel===0)return show('levels');
  }else if(screen==='levels'){
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){lvl=(lvl+1)%3;slewTo(lvl);defocus();}
    if(e.key==='ArrowUp'){lvl=(lvl+2)%3;slewTo(lvl);defocus();}
    if(e.key==='ArrowLeft'){if(lvl===0)return show('title');lvl--;slewTo(lvl);defocus();}
    if(e.key==='Enter')return show('observe');if(e.key==='Escape')return show('title');
  }else{
    if(e.key==='Escape')return show('levels');
    if(e.key==='ArrowRight')speed=Math.min(3,speed+1);if(e.key==='ArrowLeft')speed=Math.max(-3,speed-1);
    if(e.key===' '){speed=0;e.preventDefault();}
    if(e.key==='.')ev=Math.min(4,ev+.5);if(e.key===',')ev=Math.max(-4,ev-.5);
  }
  draw();
});
addEventListener('pointerdown',e=>{if(screen==='observe')drag={x:e.clientX,y:e.clientY,az:view.az,alt:view.alt};});
addEventListener('pointermove',e=>{if(!drag)return;const s=(Math.hypot(innerWidth,innerHeight)/2)/(view.fov/2);view.az=(drag.az-(e.clientX-drag.x)/s+360)%360;view.alt=Math.max(-5,Math.min(85,drag.alt+(e.clientY-drag.y)/s));});
addEventListener('pointerup',()=>drag=null);
addEventListener('wheel',e=>{if(screen!=='observe')return;fovTarget=Math.max(.5,Math.min(90,fovTarget*Math.pow(1.12,e.deltaY/100)));},{passive:true});

/* Sky */
const c=$('#cv'),x=c.getContext('2d');let W,H,k;
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const STARS=Array.from({length:2600},()=>({az:rnd()*360,alt:Math.asin(rnd())*180/Math.PI,m:rnd()**5,p:rnd()*6}));
function resize(){k=devicePixelRatio;W=c.width=innerWidth*k;H=c.height=innerHeight*k;}addEventListener('resize',resize);resize();
const hash=(a,b,c)=>{const v=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return v-Math.floor(v);};
const daz=a=>((a-view.az+540)%360)-180;
function ground(az,L){let g=1.5+Math.sin(az*.09)*1.2+Math.sin(az*.031+1)*2.2;if(L.peak){const d=(((az-L.peak[0]+540)%360)-180)/9;g+=Math.max(0,L.peak[1]*(1-Math.abs(d)));}return g;}
function sky(cx,cy,R,L,t,blur,scale){
  const s=scale||R/(view.fov/2);
  x.save();x.beginPath();x.arc(cx,cy,R,0,7);x.clip();
  const g=x.createLinearGradient(0,cy-R,0,cy+R);g.addColorStop(0,'#02030a');g.addColorStop(1,'#0b0a14');x.fillStyle=g;x.fillRect(cx-R,cy-R,2*R,2*R);
  const magLimit=Math.min(1,.35+18/view.fov);
  for(const st of STARS){const dx=daz(st.az)*s;if(Math.abs(dx)>R)continue;const dy=(st.alt-view.alt)*s;if(Math.abs(dy)>R)continue;if(st.m>magLimit)continue;
    const r=(.5+st.m*2.4)*k*(blur?2.2:1);x.globalAlpha=(.35+.65*st.m)*(.8+.2*Math.sin(t*2+st.p))*(blur?.5:1)*Math.pow(2,ev*.25);x.fillStyle='#fff';x.beginPath();x.arc(cx+dx,cy-dy,r,0,7);x.fill();}
  for(const [cell,fullAt,startAt,keep] of [[.54,20,40,.3],[.18,6.5,13,.6],[.06,2.2,4.4,.7],[.02,.75,1.5,.7]]){
    if(view.fov>startAt)continue;const fade=Math.min(1,(startAt-view.fov)/(startAt-fullAt));
    const reach=R/s,a0=Math.floor((view.az-reach)/cell),a1=Math.ceil((view.az+reach)/cell),b0=Math.floor((view.alt-reach)/cell),b1=Math.ceil((view.alt+reach)/cell);
    if((a1-a0)*(b1-b0)>9000)continue;
    for(let i=a0;i<=a1;i++)for(let j=b0;j<=b1;j++){const h=hash(i,j,cell),h2r=hash(j,i,cell+1);if(h2r>keep)continue;const h2=h2r/keep;
      const az=(i+h)*cell,alt=(j+hash(i+7,j,cell))*cell,dx=daz(az)*s,dy=(alt-view.alt)*s;
      x.globalAlpha=Math.min(1,fade*(.35+.65*h2)*Math.pow(2,ev*.25));x.fillStyle=h>.8?'#ffe6cc':h<.15?'#cce0ff':'#ffffff';x.beginPath();x.arc(cx+dx,cy-dy,(.6+h2*h2*1.8)*k,0,7);x.fill();}
  }
  x.globalAlpha=1;
  const pa=minutes/900;
  L.lights.forEach(([az,alt,r,col],i)=>{const A=az+Math.sin(pa*(i+1))*3,B=alt+Math.cos(pa*(i+1))*2;const X=cx+daz(A)*s,Y=cy-(B-view.alt)*s;const rr=r*k*Math.max(1,Math.min(6,30/view.fov))*(blur?1.6:1);
    const gl=x.createRadialGradient(X,Y,0,X,Y,rr*4);gl.addColorStop(0,col);gl.addColorStop(1,'#00000000');x.globalAlpha=.35;x.fillStyle=gl;x.beginPath();x.arc(X,Y,rr*4,0,7);x.fill();x.globalAlpha=1;x.fillStyle=col;x.beginPath();x.arc(X,Y,rr,0,7);x.fill();});
  x.fillStyle='#020102';x.beginPath();x.moveTo(cx-R,cy+R);for(let px=-R;px<=R;px+=3*k){const az=view.az+px/s;x.lineTo(cx+px,cy-(ground(az,L)-view.alt)*s);}x.lineTo(cx+R,cy+R);x.fill();
  const v=x.createRadialGradient(cx,cy,R*.55,cx,cy,R);v.addColorStop(0,'#00000000');v.addColorStop(1,'#000000e0');x.fillStyle=v;x.fillRect(cx-R,cy-R,2*R,2*R);
  x.restore();
}
function arcText(str,cx,cy,r,ang,size,col,spacing=.25){
  x.save();x.font=`${size*k}px Michroma`;x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';
  const ch=[...str],ws=ch.map(c=>x.measureText(c).width+size*k*spacing),tot=ws.reduce((a,b)=>a+b,0),bottom=Math.cos(ang)<0;
  let cum=0;ch.forEach((c,i)=>{const off=(cum+ws[i]/2-tot/2)/r,th=bottom?ang-off:ang+off;x.save();x.translate(cx+Math.sin(th)*r,cy-Math.cos(th)*r);x.rotate(bottom?th-Math.PI:th);x.fillText(c,0,0);x.restore();cum+=ws[i];});
  x.restore();
}
function barrel(cx,cy,R,rot){
  x.lineWidth=k;
  x.strokeStyle='#ff3b2f55';x.beginPath();x.arc(cx,cy,R+1*k,0,7);x.stroke();
  x.strokeStyle='#5c161199';x.beginPath();x.arc(cx,cy,R+46*k,0,7);x.stroke();
  x.strokeStyle='#2a0a08';for(let i=0;i<180;i++){const a=i/180*Math.PI*2+rot;x.beginPath();x.moveTo(cx+Math.sin(a)*(R+52*k),cy-Math.cos(a)*(R+52*k));x.lineTo(cx+Math.sin(a)*(R+70*k),cy-Math.cos(a)*(R+70*k));x.stroke();}
  x.strokeStyle='#5c1611';for(let i=0;i<72;i++){const a=i/72*Math.PI*2+rot*.5,l=i%6?5:11;x.beginPath();x.moveTo(cx+Math.sin(a)*(R+6*k),cy-Math.cos(a)*(R+6*k));x.lineTo(cx+Math.sin(a)*(R+(6+l)*k),cy-Math.cos(a)*(R+(6+l)*k));x.stroke();}
}
function reticle(cx,cy,R){
  x.strokeStyle='#ff3b2fb0';x.lineWidth=k;x.beginPath();
  x.moveTo(cx-R,cy);x.lineTo(cx-14*k,cy);x.moveTo(cx+14*k,cy);x.lineTo(cx+R,cy);x.moveTo(cx,cy-R);x.lineTo(cx,cy-14*k);x.moveTo(cx,cy+14*k);x.lineTo(cx,cy+R);x.stroke();
  x.strokeStyle='#ff3b2f70';for(let i=-10;i<=10;i++){if(!i)continue;const d=i*R/11,l=(i%5?4:9)*k;x.beginPath();x.moveTo(cx+d,cy-l);x.lineTo(cx+d,cy+l);x.moveTo(cx-l,cy+d);x.lineTo(cx+l,cy+d);x.stroke();}
  x.beginPath();x.arc(cx,cy,R*.3,0,7);x.setLineDash([2*k,5*k]);x.stroke();x.setLineDash([]);
}
let shownRing=0;
function frame(now){
  const t=now/1000,cx=W/2,cy=H/2;x.fillStyle='#000';x.fillRect(0,0,W,H);
  if(slew){view.az=(view.az+daz(slew.az)*.06+360)%360;view.alt+=(slew.alt-view.alt)*.06;view.fov+=(slew.fov-view.fov)*.06;}
  const L=LEVELS[lvl];
  if(screen==='title'){
    const R=Math.min(W,H)*.34;shownRing+=(sel-shownRing)*.12;
    view.az=(view.az+.01)%360;view.alt=40;view.fov=60;
    sky(cx,cy,R,L,t,true);barrel(cx,cy,R,-shownRing*.55);
    MENU.forEach((m,i)=>{const a=(i-shownRing)*.55;if(Math.cos(a)<.2)return;arcText(m.toUpperCase(),cx,cy,R+28*k,a,11,i===sel?'#ff5a4c':'#5c1611',.45);});
    arcText('▾',cx,cy,R+12*k,0,8,'#ff3b2f');
    arcText('STARGAZE · OBJECTIVE 120 MM · F/8',cx,cy,R+28*k,Math.PI,8,'#5c1611',.5);
  }else if(screen==='levels'){
    const R=Math.min(W,H)*.38;
    sky(cx,cy,R,L,t,false);barrel(cx,cy,R,-view.az*Math.PI/180);
    LEVELS.forEach((l,i)=>{const a=(i-lvl)*1.05;arcText(`${NUM[i]}  ${l.t.toUpperCase()}`,cx,cy,R+28*k,a,10,i===lvl?'#ff5a4c':'#5c1611',.35);});
    arcText(`AZ ${view.az.toFixed(1)}°   ALT ${view.alt.toFixed(1)}°   FIELD ${view.fov.toFixed(0)}°`,cx,cy,R+28*k,Math.PI,8,'#c22a22',.4);
  }else{
    minutes+=speed?Math.sign(speed)*10**(Math.abs(speed)-1)*.5:0;slew=null;
    view.fov+=(fovTarget-view.fov)*.15;
    // Field stop: wider than the screen when zoomed out, closes to an eyepiece as you zoom in.
    const Reye=Math.min(W,H)*.42,Rfull=Math.hypot(W,H)/2+90*k;
    const u=Math.max(0,Math.min(1,(Math.log(55)-Math.log(view.fov))/(Math.log(55)-Math.log(6)))),e=u*u*(3-2*u);
    const R=Rfull+(Reye-Rfull)*e;
    sky(cx,cy,R,L,t,false,(Math.hypot(W,H)/2)/(view.fov/2));reticle(cx,cy,Math.min(R,Reye));barrel(cx,cy,R,-view.az*Math.PI/180);
    const d=731+Math.floor(minutes/1440),m=((minutes%1440)+1440+720)%1440;
    const timeTxt=`DAY ${d} · ${String(Math.floor(m/60)).padStart(2,'0')}:${String(Math.floor(m%60)).padStart(2,'0')} · ${speed?(speed>0?'+':'−')+10**(Math.abs(speed)-1)+'×':'HELD'}`;
    const aimTxt=`AZ ${view.az.toFixed(1)}° · ALT ${view.alt.toFixed(1)}°`,fieldTxt=`FIELD ${view.fov.toFixed(1)}° · EXPOSURE ${ev>=0?'+':'−'}${Math.abs(ev).toFixed(1)} EV`;
    x.globalAlpha=e;
    if(e>.01){arcText(timeTxt,cx,cy,R+28*k,-.55,10,'#ff5a4c',.35);arcText(aimTxt,cx,cy,R+28*k,.55,10,'#ff5a4c',.35);arcText(fieldTxt,cx,cy,R+28*k,Math.PI,9,'#c22a22',.35);arcText(`FIELD STUDY ${NUM[lvl]}`,cx,cy,R+28*k,0,8,'#5c1611',.6);}
    x.globalAlpha=1;
    const cs=$('#corners');cs.style.opacity=1-e;
    if(e<.99){$('#cTL').innerHTML=`<small>Local time</small>${timeTxt}`;$('#cTR').innerHTML=`<small>Aim</small>${aimTxt}`;$('#cBL').innerHTML=`<small>Field study ${NUM[lvl]}</small>${fieldTxt}`;}
  }
  requestAnimationFrame(frame);
}
document.fonts.ready.then(()=>{show('title');requestAnimationFrame(frame);});
</script>
<script src="concept-nav.js"></script>
</body>
</html>
